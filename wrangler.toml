name = "techfinder-accounting"
compatibility_date = "2025-09-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "techfinder-db"
# Replace with the id printed by: npx wrangler d1 create techfinder-db
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# ACCESS_TEAM_DOMAIN, ACCESS_AUD and (optional) ALLOWED_EMAILS are set in the
# Cloudflare dashboard: Pages project > Settings > Variables and Secrets.
# For local dev they go in .dev.vars (see .dev.vars.example).
