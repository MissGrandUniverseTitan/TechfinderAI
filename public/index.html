<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Techfinder Accounting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B2A4A;
    --navy-light:#2A3E63;
    --teal:#2E7D6E;
    --teal-light:#E6F1EF;
    --amber:#B45309;
    --amber-light:#FEF3E2;
    --red:#B42318;
    --red-light:#FEECEC;
    --bg:#F5F6F8;
    --card:#FFFFFF;
    --border:#E3E6EB;
    --text:#1B222E;
    --muted:#6B7280;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Sarabun',sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:15px;
    line-height:1.5;
  }
  #app{display:flex; min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:230px; flex-shrink:0; background:var(--navy); color:#fff;
    display:flex; flex-direction:column; padding:20px 0;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{ padding:0 20px 20px 20px; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:14px;}
  .brand .name{font-weight:700; font-size:19px; letter-spacing:0.5px;}
  .brand .tag{font-size:11px; color:#9FB3C8; margin-top:2px; font-style:italic;}
  .navitem{
    display:flex; align-items:center; gap:10px; padding:11px 20px; cursor:pointer;
    color:#C7D2E0; font-size:14.5px; font-weight:500; border-left:3px solid transparent;
    transition:background .12s;
  }
  .navitem:hover{background:rgba(255,255,255,0.06); color:#fff;}
  .navitem.active{background:rgba(255,255,255,0.09); color:#fff; border-left-color:var(--teal);}
  .navitem .ic{width:18px; text-align:center; font-size:15px;}
  .nav-section-label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:#7488A0; padding:14px 20px 6px;}

  /* Main */
  .main{flex:1; min-width:0; padding:26px 32px 60px;}
  .pagehead{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
  .pagehead h1{font-size:22px; margin:0; color:var(--navy); font-weight:700;}
  .pagehead .sub{color:var(--muted); font-size:13.5px; margin-top:2px;}

  .btn{
    display:inline-flex; align-items:center; gap:6px; border:none; border-radius:8px;
    padding:9px 16px; font-family:'Sarabun',sans-serif; font-size:14px; font-weight:600;
    cursor:pointer; transition:filter .12s, transform .05s;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--navy); color:#fff;}
  .btn-primary:hover{filter:brightness(1.15);}
  .btn-teal{background:var(--teal); color:#fff;}
  .btn-teal:hover{filter:brightness(1.1);}
  .btn-ghost{background:#fff; color:var(--navy); border:1px solid var(--border);}
  .btn-ghost:hover{background:#F0F2F5;}
  .btn-danger{background:var(--red-light); color:var(--red);}
  .btn-danger:hover{filter:brightness(0.97);}
  .btn-sm{padding:6px 11px; font-size:12.5px; border-radius:6px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  .card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:18px;}
  .card h3{margin:0 0 14px; font-size:15.5px; color:var(--navy); font-weight:700;}

  .grid-cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:14px; margin-bottom:22px;}
  .stat{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px 20px;}
  .stat .label{font-size:12.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  .stat .val{font-size:25px; font-weight:700; color:var(--navy); margin-top:6px; font-family:'JetBrains Mono',monospace;}
  .stat .val.teal{color:var(--teal);}
  .stat .val.amber{color:var(--amber);}
  .stat .hint{font-size:12px; color:var(--muted); margin-top:4px;}

  /* Dashboard chart */
  :root{ --series-income:#1A8C78; --series-expense:#B45309; }
  .chart-head{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:12px;}
  .chart-head h3{margin:0;}
  .chart-controls{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .seg{display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .seg button{border:none; background:#fff; padding:6px 12px; font-family:'Sarabun',sans-serif; font-size:13px; cursor:pointer; color:var(--text);}
  .seg button + button{border-left:1px solid var(--border);}
  .seg button.on{background:var(--navy); color:#fff; font-weight:600;}
  .chart-legend{display:flex; gap:16px; font-size:13px; color:var(--muted); margin-bottom:6px;}
  .chart-legend .sw{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:middle;}
  .chart-wrap{position:relative;}
  .chart-wrap svg{display:block; width:100%; height:auto;}
  .chart-tip{position:absolute; pointer-events:none; background:var(--navy); color:#fff; border-radius:8px; padding:8px 10px; font-size:12.5px; line-height:1.5; white-space:nowrap; box-shadow:0 4px 14px rgba(0,0,0,.18); transform:translate(-50%, -100%); display:none; z-index:5;}
  .chart-tip .sw{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px;}
  .chart-hit{fill:transparent; cursor:default;}
  .chart-hit:hover{fill:rgba(27,42,74,0.05);}

  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{
    text-align:left; background:var(--navy); color:#fff; font-weight:600; font-size:12.5px;
    padding:10px 12px; text-transform:uppercase; letter-spacing:.02em;
  }
  th.num, td.num{text-align:right; font-family:'JetBrains Mono',monospace;}
  td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.rowhover:hover{background:#FAFBFC;}
  .empty-row td{text-align:center; color:var(--muted); padding:34px; font-size:14px;}

  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600;}
  .badge-draft{background:#EEF0F3; color:#556; }
  .badge-sent{background:#E8EEFB; color:#2952A3;}
  .badge-approved{background:var(--teal-light); color:var(--teal);}
  .badge-rejected{background:var(--red-light); color:var(--red);}
  .badge-yes{background:var(--teal-light); color:var(--teal);}
  .badge-no{background:var(--amber-light); color:var(--amber);}

  .formgrid{display:grid; grid-template-columns:1fr 1fr; gap:14px 18px;}
  .formgrid.single{grid-template-columns:1fr;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12.5px; font-weight:600; color:var(--navy);}
  .field .opt{color:var(--muted); font-weight:400;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    font-family:'Sarabun',sans-serif; font-size:14px; padding:8px 10px; border:1px solid var(--border);
    border-radius:8px; background:#fff; color:var(--text); width:100%;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--teal); outline-offset:0; border-color:var(--teal);}
  textarea{resize:vertical; min-height:60px;}

  .itemrow{display:grid; grid-template-columns:1fr 80px 130px 130px 34px; gap:8px; align-items:center; margin-bottom:8px;}
  .itemrow.recv{grid-template-columns:1fr 140px 34px;}
  .itemrow.annual{grid-template-columns:1fr 64px 110px 74px 120px 34px;}
  .itemrow-head{font-size:11.5px; color:var(--muted); font-weight:700; text-transform:uppercase;}
  .iconbtn{
    width:30px; height:30px; border-radius:7px; border:1px solid var(--border); background:#fff;
    cursor:pointer; font-size:15px; color:var(--muted); display:flex; align-items:center; justify-content:center;
  }
  .iconbtn:hover{background:var(--red-light); color:var(--red); border-color:var(--red-light);}
  .addrow-btn{margin-top:4px;}

  .totals-box{margin-top:10px; padding-top:12px; border-top:1px dashed var(--border);}
  .totals-row{display:flex; justify-content:space-between; padding:5px 0; font-size:14px;}
  .totals-row.grand{font-weight:700; font-size:17px; color:var(--navy); border-top:1px solid var(--border); margin-top:6px; padding-top:10px;}
  .totals-row .lbl{color:var(--muted);}
  .totals-row.grand .lbl{color:var(--navy);}

  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap;}
  .toolbar input, .toolbar select{width:auto; min-width:150px;}
  .spacer{flex:1;}

  .modal-backdrop{position:fixed; inset:0; background:rgba(15,20,30,0.45); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50;}
  .modal{background:#fff; border-radius:14px; width:100%; max-width:640px; padding:26px 28px; box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal h2{margin:0 0 4px; font-size:18px; color:var(--navy);}
  .modal .modal-sub{color:var(--muted); font-size:13px; margin-bottom:18px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:22px; padding-top:16px; border-top:1px solid var(--border);}

  .toast{position:fixed; bottom:24px; right:24px; background:var(--navy); color:#fff; padding:12px 18px; border-radius:9px; font-size:14px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.25); z-index:100; animation:toastin .2s ease;}
  @keyframes toastin{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  .note-banner{background:var(--teal-light); border:1px solid #C8E4DF; color:#1F5C50; padding:12px 16px; border-radius:9px; font-size:13.5px; margin-bottom:18px; display:flex; gap:10px; align-items:flex-start;}
  .note-banner.warn{background:var(--amber-light); border-color:#F3DCB0; color:#7A4A0A;}

  .empty-state{text-align:center; padding:60px 20px; color:var(--muted);}
  .empty-state .big{font-size:38px; margin-bottom:10px;}
  .empty-state .t{font-size:15px; font-weight:600; color:var(--navy); margin-bottom:4px;}

  .link-btn{background:none; border:none; color:var(--teal); font-weight:600; cursor:pointer; font-family:'Sarabun',sans-serif; font-size:13.5px; padding:0;}
  .link-btn:hover{text-decoration:underline;}

  .print-only{display:none;}
  @media print{
    .sidebar, .pagehead .actions, .toolbar, .no-print{display:none !important;}
    .main{padding:0;}
    body{background:#fff;}
    .print-only{display:block;}
    .print-doc{max-width:800px; margin:0 auto;}
  }

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:#c7cdd6; border-radius:6px;}
</style>
</head>

// Throws on any failure, so a network error or expired login never
// starts the app with an empty state that the next save would write over real data.
async function loadState(){
  const res = await fetch('/api/data', { credentials: 'same-origin' });
  if(!res.ok) throw new Error('load failed with status ' + res.status);
  const data = await res.json();
  currentUser = data.user || null;
  if(data.value){
    const parsed = JSON.parse(data.value);
    const base = defaultState();
    return Object.assign(base, parsed, {settings: Object.assign(base.settings, parsed.settings)});
  }
  return defaultState();
}

async function saveState(){
  try{
    const res = await fetch('/api/data', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ value: JSON.stringify(state) })
    });
    if(res.status===401 || res.status===403){
      showToast('เซสชันหมดอายุ กรุณาโหลดหน้าใหม่เพื่อเข้าสู่ระบบอีกครั้ง');
      return;
    }
    if(!res.ok) throw new Error('save failed with status ' + res.status);
  }catch(e){
    console.error('Storage save failed', e);
    showToast('บันทึกไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตหรือเข้าสู่ระบบใหม่ แล้วลองอีกครั้ง');
  }
}

/* ============================= HELPERS ============================= */
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmt(n){
  n = Number(n)||0;
  return n.toLocaleString('th-TH',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function thaiDate(iso){
  if(!iso) return '-';
  const d = new Date(iso+'T00:00:00');
  const months=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543}`;
}
function nextQtNo(){
  // QT-TFD-<วันที่+เวลาขณะออกเลข ตามเวลาไทย GMT+7> ไม่ผูกกับ timezone ของเครื่อง/เบราว์เซอร์ผู้ใช้
  const bkk = new Date(Date.now() + 7*60*60000);
  const pad = n => String(n).padStart(2,'0');
  const y = bkk.getUTCFullYear();
  const m = pad(bkk.getUTCMonth()+1);
  const d = pad(bkk.getUTCDate());
  const hh = pad(bkk.getUTCHours());
  const mm = pad(bkk.getUTCMinutes());
  const ss = pad(bkk.getUTCSeconds());
  return `QT-TFD-${y}${m}${d}${hh}${mm}${ss}`;
}
function nextRcNo(){
  const year = new Date().getFullYear()+543;
  const n = String(state.counters.rc).padStart(3,'0');
  return `RC-${year}-${n}`;
}
function clientName(id){
  const c = state.clients.find(c=>c.id===id);
  return c ? c.name : '(ไม่พบลูกค้า)';
}
function qtRowTotal(it){
  const months = it.months===undefined ? 1 : (Number(it.months)||0);
  return (Number(it.qty)||0)*(Number(it.unitPrice)||0)*months;
}
function qtTotal(qt){
  const sum = list => (list||[]).reduce((s,i)=>s+qtRowTotal(i), 0);
  return {one: sum(qt.oneTimeItems), rec: sum(qt.recurringItems), ann: sum(qt.annualItems)};
}
function newQtItem(list){
  return list==='annualItems' ? {desc:'', qty:1, unitPrice:0, months:12} : {desc:'', qty:1, unitPrice:0};
}
function qtGrossActive(qt){
  const t = qtTotal(qt);
  if(qt.qtType==='recurring') return t.rec;
  if(qt.qtType==='annual') return t.ann;
  return t.one;
}
// VAT is added on top of the pre-VAT amount; WHT is always calculated on the pre-VAT amount.
function qtVat(qt){ return qt.vatEnabled ? qtGrossActive(qt) * (Number(qt.vatRate)||0)/100 : 0; }
function qtWht(qt){ return qt.whtEnabled ? qtGrossActive(qt) * (Number(qt.whtRate)||0)/100 : 0; }
function qtNet(qt){ return qtGrossActive(qt) + qtVat(qt) - qtWht(qt); }
function rcGross(rc){ return (rc.items||[]).reduce((s,i)=>s+(Number(i.amount)||0),0); }
function rcVat(rc){ return rc.vatEnabled ? rcGross(rc) * (Number(rc.vatRate)||0)/100 : 0; }
function rcWht(rc){ return rc.whtEnabled ? rcGross(rc) * (Number(rc.whtRate)||0)/100 : 0; }
function rcNet(rc){ return rcGross(rc) + rcVat(rc) - rcWht(rc); }

  {code:'40_5', label:'มาตรา 40(5) ค่าเช่าทรัพย์สิน', rate:5},
  {code:'other', label:'อื่นๆ (ระบุอัตราเอง)', rate:0},
];
function txWht(t){ return t.whtEnabled ? (Number(t.amount)||0) * (Number(t.whtRate)||0)/100 : 0; }
function txVat(t){ return t.vatEnabled ? (Number(t.amount)||0) * (Number(t.vatRate)||0)/100 : 0; }
function txInvoiceTotal(t){ return (Number(t.amount)||0) + txVat(t); }
function txNetPaid(t){ return txInvoiceTotal(t) - txWht(t); }
function nextWhtCertNo(){
  const bkk = new Date(Date.now() + 7*60*60000);
  const pad = n => String(n).padStart(2,'0');
  return `WHT-TFD-${bkk.getUTCFullYear()}${pad(bkk.getUTCMonth()+1)}${pad(bkk.getUTCDate())}${pad(bkk.getUTCHours())}${pad(bkk.getUTCMinutes())}${pad(bkk.getUTCSeconds())}`;
}

function showToast(msg){
  toastMsg = msg;
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ toastMsg=null; render(); }, 2600);
}

function yearOf(iso){ return iso ? Number(iso.slice(0,4)) : new Date().getFullYear(); }

function allYears(){
  const ys = new Set();
  state.receipts.forEach(r=>ys.add(yearOf(r.date)));
  state.transactions.forEach(t=>ys.add(yearOf(t.date)));
  ys.add(new Date().getFullYear());
  return Array.from(ys).sort((a,b)=>b-a);
}

// Copies what the user has typed in an open form's plain fields back into the form object.
// Without this, any re-render (adding a row, editing an item, ticking a checkbox) redraws
// these fields from stale values: the client jumps back to the first one and the project name is lost.
// Rates and checkboxes are left out on purpose: their own handlers keep them in sync.
function syncOpenForm(){
  if(!modal) return;
  const val = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  const set = (obj, key, v, f) => { if(obj && v!==undefined) obj[key] = f ? f(v) : v; };
  if(modal.type==='qt'){
    set(qtForm,'clientId',val('qt-client'));
    set(qtForm,'date',val('qt-date'));
    set(qtForm,'validDays',val('qt-validdays'), v=>Number(v)||30);
    set(qtForm,'projectName',val('qt-project'));
  }
  if(modal.type==='rc'){
    set(rcForm,'clientId',val('rc-client'));
    set(rcForm,'date',val('rc-date'));
    set(rcForm,'refQt',val('rc-refqt'));
    set(rcForm,'paymentMethod',val('rc-method'));
  }
  if(modal.type==='tx'){
    set(txForm,'date',val('tx-date'));
    set(txForm,'category',val('tx-category'));
    set(txForm,'description',val('tx-desc'));
    set(txForm,'payeeName',val('tx-payee-name'));
    set(txForm,'payeeTaxId',val('tx-payee-taxid'));
    set(txForm,'payeeAddress',val('tx-payee-address'));
  }
}

/* ============================= DASHBOARD ============================= */
let dashFilter = {period:'quarter', year: new Date().getFullYear()};

const TH_MONTH_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

// Income = recorded income (pre-VAT); expense = invoice total incl. VAT, same as the stat tiles.
function periodBuckets(){
  const {period, year} = dashFilter;
  let buckets;
  if(period==='year'){
    const years = allYears().slice(0,5).reverse();
    buckets = years.map(y=>({label:`ปี ${y+543}`, sub:'', match:d=>yearOf(d)===y}));
  } else {
    const size = period==='half' ? 6 : 3;
    const n = 12/size;
    buckets = Array.from({length:n}, (_,i)=>({
      label: period==='half' ? (i===0 ? 'ครึ่งปีแรก' : 'ครึ่งปีหลัง') : `ไตรมาส ${i+1}`,
      sub: `${TH_MONTH_SHORT[i*size]}–${TH_MONTH_SHORT[i*size+size-1]}`,
      match: d => d && yearOf(d)===year && Math.floor((Number(d.slice(5,7))-1)/size)===i,
    }));
  }
  return buckets.map(b=>{
    const tx = state.transactions.filter(t=>b.match(t.date));
    const income = tx.filter(t=>t.type==='income').reduce((s,t)=>s+(Number(t.amount)||0),0);
    const expense = tx.filter(t=>t.type==='expense').reduce((s,t)=>s+txInvoiceTotal(t),0);
    return {label:b.label, sub:b.sub, income, expense, profit:income-expense};
  });
}

function fmtShort(n){
  const a = Math.abs(n);
  if(a>=1e6) return (n/1e6).toLocaleString('th-TH',{maximumFractionDigits:1})+'M';
  if(a>=1e3) return (n/1e3).toLocaleString('th-TH',{maximumFractionDigits:1})+'K';
  return n.toLocaleString('th-TH',{maximumFractionDigits:0});
}

function niceMax(v){
  if(v<=0) return 1000;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for(const m of [1,1.5,2,2.5,3,4,5,6,8,10]) if(m*p>=v) return m*p;
  return 10*p;
}

// Bar with 4px rounded top, flat on the baseline.
function barPath(x, y, w, h){
  if(h<=0) return '';
  const r = Math.min(4, w/2, h);
  return `M${x},${y+h} V${y+r} Q${x},${y} ${x+r},${y} H${x+w-r} Q${x+w},${y} ${x+w},${y+r} V${y+h} Z`;
}

function dashChartSvg(rows){
  const W=720, H=280, padL=52, padR=12, padT=12, padB=46;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const max = niceMax(Math.max(...rows.map(r=>Math.max(r.income, r.expense)), 0));
  const ticks = [0,0.25,0.5,0.75,1].map(f=>f*max);
  const yOf = v => padT + plotH - (v/max)*plotH;
  const groupW = plotW/rows.length;
  const barW = Math.min(44, (groupW*0.6-2)/2);
  const grid = ticks.map(v=>`
    <line x1="${padL}" x2="${W-padR}" y1="${yOf(v)}" y2="${yOf(v)}" stroke="${v===0?'#C9CED6':'#E3E6EB'}" stroke-width="1"/>
    <text x="${padL-8}" y="${yOf(v)+4}" text-anchor="end" font-size="11" fill="#6B7280">${fmtShort(v)}</text>`).join('');
  const bars = rows.map((r,i)=>{
    const cx = padL + groupW*i + groupW/2;
    const xI = cx - barW - 1, xE = cx + 1;
    const hI = (r.income/max)*plotH, hE = (r.expense/max)*plotH;
    const tip = `<b>${esc(r.label)}${r.sub?' ('+r.sub+')':''}</b><br>`+
      `<span class='sw' style='background:var(--series-income)'></span>รายรับ ${fmt(r.income)} บาท<br>`+
      `<span class='sw' style='background:var(--series-expense)'></span>รายจ่าย ${fmt(r.expense)} บาท<br>`+
      `${r.profit>=0?'กำไร':'ขาดทุน'} ${fmt(Math.abs(r.profit))} บาท`;
    return `
      <rect class="chart-hit" x="${padL+groupW*i}" y="${padT}" width="${groupW}" height="${plotH}" data-tip="${escAttr(tip)}" data-tip-x="${cx}" data-tip-y="${yOf(Math.max(r.income,r.expense))}"></rect>
      <path d="${barPath(xI, yOf(r.income), barW, hI)}" fill="var(--series-income)" pointer-events="none"/>
      <path d="${barPath(xE, yOf(r.expense), barW, hE)}" fill="var(--series-expense)" pointer-events="none"/>
      <text x="${cx}" y="${H-padB+18}" text-anchor="middle" font-size="12" fill="#1B222E" font-weight="600">${esc(r.label)}</text>
      ${r.sub?`<text x="${cx}" y="${H-padB+34}" text-anchor="middle" font-size="11" fill="#6B7280">${r.sub}</text>`:''}`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟรายรับและรายจ่าย">${grid}${bars}</svg>`;
}

function dashChartCard(){
  const rows = periodBuckets();
  const {period, year} = dashFilter;
  const years = allYears();
  const totals = rows.reduce((a,r)=>({income:a.income+r.income, expense:a.expense+r.expense}), {income:0, expense:0});
  const profit = totals.income - totals.expense;
  const btn = (v, l) => `<button data-action="dash-period" data-period="${v}" class="${period===v?'on':''}">${l}</button>`;
  return `
    <div class="card">
      <div class="chart-head">
        <h3>รายรับ - รายจ่าย ${period==='year' ? 'รายปี' : (period==='half'?'รายครึ่งปี':'รายไตรมาส')+' ปี '+(year+543)}</h3>
        <div class="chart-controls">
          <div class="seg">${btn('quarter','รายไตรมาส')}${btn('half','รายครึ่งปี')}${btn('year','รายปี')}</div>
          ${period==='year' ? '' : `<select id="dash-year" style="width:auto; padding:5px 8px; font-size:13px;">${years.map(y=>`<option value="${y}" ${y===year?'selected':''}>ปี ${y+543}</option>`).join('')}</select>`}
        </div>
      </div>
      <div class="chart-legend">
        <span><span class="sw" style="background:var(--series-income)"></span>รายรับ</span>
        <span><span class="sw" style="background:var(--series-expense)"></span>รายจ่าย</span>
      </div>
      <div class="chart-wrap">${dashChartSvg(rows)}<div class="chart-tip"></div></div>
      <table style="margin-top:12px;">
        <thead><tr><th>ช่วงเวลา</th><th class="num">รายรับ</th><th class="num">รายจ่าย</th><th class="num">กำไร (ขาดทุน)</th></tr></thead>
        <tbody>
          ${rows.map(r=>`<tr><td>${esc(r.label)}${r.sub?` <span style="color:var(--muted); font-size:12px;">${r.sub}</span>`:''}</td>
            <td class="num">${fmt(r.income)}</td><td class="num">${fmt(r.expense)}</td>
            <td class="num" style="color:${r.profit<0?'var(--red)':'var(--text)'}; font-weight:600;">${r.profit<0?'(':''}${fmt(Math.abs(r.profit))}${r.profit<0?')':''}</td></tr>`).join('')}
          <tr><td><b>รวม</b></td><td class="num"><b>${fmt(totals.income)}</b></td><td class="num"><b>${fmt(totals.expense)}</b></td>
            <td class="num" style="color:${profit<0?'var(--red)':'var(--text)'};"><b>${profit<0?'(':''}${fmt(Math.abs(profit))}${profit<0?')':''}</b></td></tr>
        </tbody>
      </table>
    </div>`;
}

  const v = map[s] || map.draft;
  return `<span class="badge ${v[1]}">${v[0]}</span>`;
}

}
// Totals rows for a pre-VAT amount with optional VAT (+) and WHT (-), shared by quotations and receipts.
function taxTotalsHtml(label, netLabel, gross, f, unit){
  const vat = f.vatEnabled ? gross*(Number(f.vatRate)||0)/100 : 0;
  const wht = f.whtEnabled ? gross*(Number(f.whtRate)||0)/100 : 0;
  if(!f.vatEnabled && !f.whtEnabled){
    return `<div class="totals-row grand"><span class="lbl">${label}</span><span>${fmt(gross)} ${unit}</span></div>`;
  }
  return `
    <div class="totals-row"><span class="lbl">${label} (ก่อน VAT/ก่อนหัก)</span><span>${fmt(gross)} ${unit}</span></div>
    ${f.vatEnabled?`<div class="totals-row"><span class="lbl">ภาษีมูลค่าเพิ่ม ${fmt(f.vatRate)}%</span><span>+ ${fmt(vat)} ${unit}</span></div>
    <div class="totals-row"><span class="lbl">รวมทั้งสิ้น (รวม VAT)</span><span>${fmt(gross+vat)} ${unit}</span></div>`:''}
    ${f.whtEnabled?`<div class="totals-row"><span class="lbl">หัก ณ ที่จ่าย ${fmt(f.whtRate)}% (จากยอดก่อน VAT)</span><span>- ${fmt(wht)} ${unit}</span></div>`:''}
    <div class="totals-row grand"><span class="lbl">${f.whtEnabled?netLabel:'ยอดชำระทั้งสิ้น'}</span><span>${fmt(gross+vat-wht)} ${unit}</span></div>
  `;
}

function txTotalsBoxHtml(f){
  if(!f.whtEnabled && !f.vatEnabled) return '';
  const amount = Number(f.amount)||0;
  const vat = f.vatEnabled ? amount * (Number(f.vatRate)||0)/100 : 0;
  const invoiceTotal = amount + vat;
  const wht = f.whtEnabled ? amount * (Number(f.whtRate)||0)/100 : 0; // WHT base is always pre-VAT
  const net = invoiceTotal - wht;
  return `
    <div class="totals-row"><span class="lbl">ยอดก่อน VAT (ฐานคำนวณภาษีหัก ณ ที่จ่าย)</span><span>${fmt(amount)} บาท</span></div>
    ${f.vatEnabled?`<div class="totals-row"><span class="lbl">VAT ${fmt(f.vatRate)}%</span><span>+ ${fmt(vat)} บาท</span></div>
    <div class="totals-row"><span class="lbl">ยอดตามใบแจ้งหนี้ (รวม VAT)</span><span>${fmt(invoiceTotal)} บาท</span></div>`:''}
    ${f.whtEnabled?`<div class="totals-row"><span class="lbl">หัก ณ ที่จ่าย ${fmt(f.whtRate)}% (คิดจากยอดก่อน VAT)</span><span>- ${fmt(wht)} บาท</span></div>`:''}
    <div class="totals-row grand"><span class="lbl">จ่ายสุทธิให้ผู้รับเงิน</span><span>${fmt(net)} บาท</span></div>
  `;
}

function renderExpenseByCategory(txYear){
  const map = {};
  txYear.filter(t=>t.type==='expense').forEach(t=>{
    map[t.category] = (map[t.category]||0) + txInvoiceTotal(t);
  });
  const rows = Object.entries(map).sort((a,b)=>b[1]-a[1]);
  if(rows.length===0) return `<div style="color:var(--muted); font-size:14px;">ยังไม่มีรายจ่ายบันทึกไว้ในปีนี้</div>`;
  return `<table><thead><tr><th>หมวดหมู่</th><th class="num">รวม</th></tr></thead><tbody>
    ${rows.map(([cat,amt])=>`<tr class="rowhover"><td>${esc(cat)}</td><td class="num">${fmt(amt)}</td></tr>`).join('')}
  </tbody></table>`;
}

/* ============================= PRINT VIEWS ============================= */
function addDays(iso, days){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate() + (Number(days)||0));
  return d.toISOString().slice(0,10);
}

function printQt(qt){
  const t = qtTotal(qt);
  const cl = state.clients.find(c=>c.id===qt.clientId) || {name:'-'};
  const s = state.settings;
  const type = qt.qtType==='recurring' ? 'recurring' : qt.qtType==='annual' ? 'annual' : 'one_time';
  const isOneTime = type==='one_time';
  const validUntil = addDays(qt.date, qt.validDays||30);
  const vat = qtVat(qt), wht = qtWht(qt), net = qtNet(qt);
  const unitLabel = type==='recurring' ? ' / เดือน' : '';
  const span = type==='annual' ? 4 : 3;
  const whtRows = `
    ${qt.vatEnabled ? `
    <tr><td colspan="${span}">ภาษีมูลค่าเพิ่ม ${fmt(qt.vatRate)}%</td><td class="num">+ ${fmt(vat)}</td></tr>
    <tr class="totalrow"><td colspan="${span}">รวมทั้งสิ้น (รวม VAT)${unitLabel}</td><td class="num">${fmt(qtGrossActive(qt)+vat)}</td></tr>` : ''}
    ${qt.whtEnabled ? `
    <tr><td colspan="${span}">หัก ภาษี ณ ที่จ่าย ${fmt(qt.whtRate)}% (จากยอดก่อน VAT)</td><td class="num">- ${fmt(wht)}</td></tr>
    <tr class="totalrow"><td colspan="${span}">รับสุทธิโดยประมาณ${unitLabel}</td><td class="num">${fmt(net)}</td></tr>` : ''}
  `;

  const itemTableHtml = type==='annual' ? `
    <table><thead><tr><th>License รายปี</th><th class="num">จำนวน</th><th class="num">ราคา/เดือน (บาท)</th><th class="num">จำนวนเดือน</th><th class="num">รวมราคา (บาท)</th></tr></thead>
    <tbody>
    ${qt.annualItems.filter(it=>it.desc||it.unitPrice).map(it=>`<tr><td>${esc(it.desc)}</td><td class="num">${it.qty}</td><td class="num">${fmt(it.unitPrice)}</td><td class="num">${it.months}</td><td class="num">${fmt(qtRowTotal(it))}</td></tr>`).join('')}
    <tr class="totalrow"><td colspan="4">รวม License รายปี</td><td class="num">${fmt(t.ann)}</td></tr>
    ${whtRows}
    </tbody></table>
  ` : isOneTime ? `

      พร้อมนำส่งภาษีที่หักไว้ต่อกรมสรรพากรภายในวันที่ 7 ของเดือนถัดจากเดือนที่จ่ายเงิน (หรือภายในวันที่ 15 หากยื่นผ่านอินเทอร์เน็ต)
    </div>

    <div style="margin-top:60px; text-align:right;">
      <div style="display:inline-block; text-align:center;">
        <div style="border-bottom:1px solid #999; width:220px; height:40px;"></div>
        <div class="muted">ผู้จ่ายเงิน (${esc(s.signatoryName||'...........................................................')})</div>
      </div>
    </div>
    </body></html>
  `);
  win.document.close();
  setTimeout(()=>win.print(), 300);
}

/* ============================= MODAL WRAPPER ============================= */
function renderModal(){
  let body = '';
  if(modal.type==='client') body = clientModal(modal.payload);
  if(modal.type==='qt') body = qtModal();
  if(modal.type==='rc') body = rcModal();
  if(modal.type==='tx') body = txModal();
  return `<div class="modal-backdrop" id="modal-backdrop-el"><div class="modal">${body}</div></div>`;
}

/* ============================= ESCAPE HELPERS ============================= */
function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escAttr(str){ return esc(str); }

/* ============================= EVENTS ============================= */
function bindEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{ currentView = el.dataset.nav; render(); });
  });

  // Generic click handler via delegation on #app to keep it simple & robust
  const app = document.getElementById('app');
  app.onclick = async (e)=>{
    if(e.target.id==='modal-backdrop-el'){ modal=null; render(); return; }
    const t = e.target.closest('[data-action]');
    if(!t) return;
    const action = t.dataset.action;

    if(action==='dash-period'){ dashFilter.period = t.dataset.period; render(); return; }

    if(action==='close-modal'){ modal=null; render(); return; }

    if(action==='new-client'){ modal={type:'client', payload:null}; render(); return; }
    if(action==='edit-client'){ modal={type:'client', payload: state.clients.find(c=>c.id===t.dataset.id)}; render(); return; }
    if(action==='delete-client'){
      if(confirm('ลบลูกค้ารายนี้หรือไม่?')){ state.clients = state.clients.filter(c=>c.id!==t.dataset.id); await saveState(); render(); showToast('ลบลูกค้าแล้ว'); }
      return;
    }
    if(action==='save-client'){
      const id = t.dataset.id;
      const data = {
        name: document.getElementById('f-name').value.trim(),
        taxId: document.getElementById('f-taxid').value.trim(),
        contact: document.getElementById('f-contact').value.trim(),
        address: document.getElementById('f-address').value.trim(),
        phone: document.getElementById('f-phone').value.trim(),
        email: document.getElementById('f-email').value.trim(),
      };
      if(!data.name){ showToast('กรุณากรอกชื่อบริษัท'); return; }
      if(id){
        const c = state.clients.find(c=>c.id===id);
        Object.assign(c, data);
      } else {
        state.clients.push({id:uid('cl'), ...data});
      }
      await saveState(); modal=null; render(); showToast('บันทึกข้อมูลลูกค้าแล้ว');
      return;
    }

    /* QUOTATIONS */
    if(action==='new-qt'){
      if(state.clients.length===0){ showToast('กรุณาเพิ่มลูกค้าก่อน'); return; }
      newQtForm(null); modal={type:'qt', payload:null}; render(); return;
    }
    if(action==='edit-qt'){ newQtForm(state.quotations.find(q=>q.id===t.dataset.id)); modal={type:'qt', payload:null}; render(); return; }
    if(action==='delete-qt'){
      if(confirm('ลบใบเสนอราคานี้หรือไม่?')){ state.quotations = state.quotations.filter(q=>q.id!==t.dataset.id); await saveState(); render(); showToast('ลบแล้ว'); }
      return;
    }
    if(action==='qt-add-row'){
      qtForm[t.dataset.list].push(newQtItem(t.dataset.list));
      render(); return;
    }
    if(action==='qt-remove-row'){
      qtForm[t.dataset.list].splice(Number(t.dataset.idx),1);
      if(qtForm[t.dataset.list].length===0) qtForm[t.dataset.list].push(newQtItem(t.dataset.list));
      render(); return;
    }
    if(action==='save-qt'){
      qtForm.clientId = document.getElementById('qt-client').value;
      qtForm.date = document.getElementById('qt-date').value;
      qtForm.validDays = Number(document.getElementById('qt-validdays').value)||30;
      qtForm.projectName = document.getElementById('qt-project').value.trim();
      qtForm.whtEnabled = document.getElementById('qt-wht-enabled').checked;
      qtForm.whtRate = Number(document.getElementById('qt-wht-rate').value)||0;
      qtForm.vatEnabled = document.getElementById('qt-vat-enabled').checked;
      qtForm.vatRate = Number(document.getElementById('qt-vat-rate').value)||0;
      if(qtForm.id){
        const i = state.quotations.findIndex(q=>q.id===qtForm.id);
        state.quotations[i] = qtForm;
      } else {
        qtForm.id = uid('qt');
        state.quotations.push(qtForm);
        state.counters.qt += 1;
      }
      await saveState(); modal=null; render(); showToast('บันทึกใบเสนอราคาแล้ว');
      return;
    }
    if(action==='print-qt'){ printQt(state.quotations.find(q=>q.id===t.dataset.id)); return; }
    if(action==='qt-to-receipt'){
      const qt = state.quotations.find(q=>q.id===t.dataset.id);
      newRcForm(null, qt);
      modal={type:'rc', payload:null}; render();
      return;
    }

    /* RECEIPTS */
    if(action==='new-rc'){
      if(state.clients.length===0){ showToast('กรุณาเพิ่มลูกค้าก่อน'); return; }
      newRcForm(null,null); modal={type:'rc', payload:null}; render(); return;
    }
    if(action==='edit-rc'){ newRcForm(state.receipts.find(r=>r.id===t.dataset.id)); modal={type:'rc', payload:null}; render(); return; }
    if(action==='delete-rc'){
      if(confirm('ลบใบเสร็จนี้หรือไม่? (รายการรายรับที่เกี่ยวข้องจะถูกลบด้วย)')){
        removeTransactionsForReceipt(t.dataset.id);
        state.receipts = state.receipts.filter(r=>r.id!==t.dataset.id);
        await saveState(); render(); showToast('ลบแล้ว');
      }
      return;
    }
    if(action==='rc-add-row'){ rcForm.items.push({desc:'', amount:0}); render(); return; }
    if(action==='rc-remove-row'){
      rcForm.items.splice(Number(t.dataset.idx),1);
      if(rcForm.items.length===0) rcForm.items.push({desc:'',amount:0});
      render(); return;
    }
    if(action==='save-rc'){
      rcForm.clientId = document.getElementById('rc-client').value;
      rcForm.date = document.getElementById('rc-date').value;
      rcForm.refQt = document.getElementById('rc-refqt').value.trim();
      rcForm.paymentMethod = document.getElementById('rc-method').value;
      rcForm.whtEnabled = document.getElementById('rc-wht-enabled').checked;
      rcForm.whtRate = Number(document.getElementById('rc-wht-rate').value)||0;
      rcForm.vatEnabled = document.getElementById('rc-vat-enabled').checked;
      rcForm.vatRate = Number(document.getElementById('rc-vat-rate').value)||0;
      const isNew = !rcForm.id;
      if(!isNew){
        removeTransactionsForReceipt(rcForm.id);
        const i = state.receipts.findIndex(r=>r.id===rcForm.id);
        state.receipts[i] = rcForm;
      } else {
        rcForm.id = uid('rc');
        state.receipts.push(rcForm);
        state.counters.rc += 1;
      }
      addTransactionFromReceipt(rcForm);
      await saveState(); modal=null; render(); showToast('บันทึกใบเสร็จแล้ว');
      return;
    }
    if(action==='print-rc'){ printRc(state.receipts.find(r=>r.id===t.dataset.id)); return; }
    if(action==='toggle-wht-cert'){
      // handled on 'change' for the checkbox variant; this covers non-checkbox triggers (safety no-op)
      return;
    }
    if(action==='mark-wht-cert-received'){
      const r = state.receipts.find(r=>r.id===t.dataset.id);
      r.whtCertReceived = true;
      await saveState(); render(); showToast('ทำเครื่องหมายว่าได้รับ 50 ทวิ แล้ว');
      return;
    }

    /* TRANSACTIONS */
    if(action==='new-tx'){ newTxForm(); modal={type:'tx', payload:null}; render(); return; }
    if(action==='edit-tx'){ newTxForm(state.transactions.find(x=>x.id===t.dataset.id)); modal={type:'tx', payload:null}; render(); return; }
    if(action==='save-tx'){
      txForm.date = document.getElementById('tx-date').value;
      txForm.category = document.getElementById('tx-category').value;
      txForm.description = document.getElementById('tx-desc').value.trim();
      txForm.amount = Number(document.getElementById('tx-amount').value)||0;
      txForm.vatEnabled = document.getElementById('tx-vat-enabled').checked;
      txForm.vatRate = Number(document.getElementById('tx-vat-rate').value)||0;
      txForm.whtEnabled = document.getElementById('tx-wht-enabled').checked;
      if(txForm.whtEnabled){
        txForm.payeeName = document.getElementById('tx-payee-name').value.trim();
        txForm.payeeTaxId = document.getElementById('tx-payee-taxid').value.trim();
        txForm.payeeAddress = document.getElementById('tx-payee-address').value.trim();
        txForm.whtType = document.getElementById('tx-wht-type').value;
        txForm.whtRate = Number(document.getElementById('tx-wht-rate').value)||0;
      }
      if(txForm.amount<=0){ showToast('กรุณากรอกจำนวนเงิน'); return; }
      if(txForm.whtEnabled && !txForm.payeeName){ showToast('กรุณากรอกชื่อผู้รับเงิน'); return; }
      if(txForm.whtEnabled && !txForm.certNo) txForm.certNo = nextWhtCertNo();
      if(txForm.id){
        const i = state.transactions.findIndex(x=>x.id===txForm.id);
        state.transactions[i] = {...txForm, type:'expense'};
      } else {
        state.transactions.push({id:uid('tx'), type:'expense', ...txForm});
      }
      await saveState(); modal=null; render(); showToast('บันทึกรายจ่ายแล้ว');
      return;
    }
    if(action==='delete-tx'){
      if(confirm('ลบรายการนี้หรือไม่?')){ state.transactions = state.transactions.filter(x=>x.id!==t.dataset.id); await saveState(); render(); showToast('ลบแล้ว'); }
      return;
    }
    if(action==='print-wht'){ printWht50(state.transactions.find(x=>x.id===t.dataset.id)); return; }

    /* SETTINGS */
    if(action==='save-settings'){
      state.settings = {
        companyName: document.getElementById('s-name').value.trim(),
        taxId: document.getElementById('s-taxid').value.trim(),
        address: document.getElementById('s-address').value.trim(),
        phone: document.getElementById('s-phone').value.trim(),
        email: document.getElementById('s-email').value.trim(),
        website: document.getElementById('s-website').value.trim(),
        signatoryName: document.getElementById('s-signatory').value.trim(),
        vatRegistered: document.getElementById('s-vat').checked,
        defaultWhtRate: Number(document.getElementById('s-wht').value)||3,
        bankName: document.getElementById('s-bank-name').value.trim(),
        bankBranch: document.getElementById('s-bank-branch').value.trim(),
        bankAccountType: document.getElementById('s-bank-type').value.trim(),
        bankAccountNo: document.getElementById('s-bank-no').value.trim(),
        bankAccountName: document.getElementById('s-bank-acname').value.trim(),
      };
      await saveState(); showToast('บันทึกการตั้งค่าแล้ว'); render();
      return;
    }
  };

  // change handlers (selects, checkboxes, item inputs) via delegation
  app.onchange = async (e)=>{
    if(e.target.id==='qt-type'){
      qtForm.qtType = e.target.value;
      render();
      return;
    }
    if(e.target.id==='rc-wht-enabled'){
      rcForm.whtEnabled = e.target.checked;
      render();
      return;
    }
    if(e.target.id==='qt-wht-enabled'){
      qtForm.whtEnabled = e.target.checked;
      render();
      return;
    }
    if(e.target.id==='qt-vat-enabled'){
      qtForm.vatEnabled = e.target.checked;
      render();
      return;
    }
    if(e.target.id==='rc-vat-enabled'){
      rcForm.vatEnabled = e.target.checked;
      render();
      return;
    }
    if(e.target.id==='dash-year'){ dashFilter.year = Number(e.target.value); render(); return; }
    if(e.target.id==='tx-vat-enabled'){
      txForm.vatEnabled = e.target.checked;
      render();
      return;
    }
    if(e.target.id==='tx-wht-enabled'){
      txForm.whtEnabled = e.target.checked;
      render();
      return;
    }
    if(e.target.id==='tx-wht-type'){
      const opt = WHT_INCOME_TYPES.find(o=>o.code===e.target.value);
      txForm.whtType = e.target.value;
      if(opt) txForm.whtRate = opt.rate;
      render();
      return;
    }
    if(e.target.id==='tx-year-filter'){ txFilter.year = Number(e.target.value); render(); return; }
    if(e.target.id==='tx-type-filter'){ txFilter.type = e.target.value; render(); return; }
    if(e.target.id==='tax-year-filter'){ taxYear = Number(e.target.value); render(); return; }

    const t = e.target.closest('[data-action]');
    if(!t) return;
    const action = t.dataset.action;

    if(action==='qt-status'){
      const q = state.quotations.find(q=>q.id===t.dataset.id);
      q.status = t.value; await saveState(); render(); showToast('อัปเดตสถานะแล้ว');
      return;
    }
    if(action==='toggle-wht-cert'){
      const r = state.receipts.find(r=>r.id===t.dataset.id);
      r.whtCertReceived = t.checked; await saveState(); render();
      return;
    }
    if(action==='qt-item-input'){
      const row = t.closest('.itemrow');
      const list = row.dataset.list, idx = Number(row.dataset.idx), field = t.dataset.field;
      qtForm[list][idx][field] = field==='desc' ? t.value : Number(t.value)||0;
      render(); return;
    }
    if(action==='rc-item-input'){
      const row = t.closest('.itemrow');
      const idx = Number(row.dataset.idx), field = t.dataset.field;
      rcForm.items[idx][field] = field==='desc' ? t.value : Number(t.value)||0;
      render(); return;
    }
  };

  // chart tooltip: hover a period to see its exact figures
  app.onmouseover = (e)=>{
    const hit = e.target.closest && e.target.closest('.chart-hit');
    const wrap = document.querySelector('.chart-wrap');
    const tip = wrap && wrap.querySelector('.chart-tip');
    if(!tip) return;
    if(!hit){ tip.style.display='none'; return; }
    const svg = wrap.querySelector('svg');
    const scale = svg.getBoundingClientRect().width / svg.viewBox.baseVal.width;
    tip.innerHTML = hit.dataset.tip;
    tip.style.left = (Number(hit.dataset.tipX)*scale)+'px';
    tip.style.top = (Number(hit.dataset.tipY)*scale - 8)+'px';
    tip.style.display = 'block';
  };

  // live input for item rows (keyup for instant total updates) + wht toggle live update
  app.oninput = (e)=>{
    const t = e.target;
    if(t.dataset && t.dataset.action==='qt-item-input'){
      const row = t.closest('.itemrow');
      const list = row.dataset.list, idx = Number(row.dataset.idx), field = t.dataset.field;
      qtForm[list][idx][field] = field==='desc' ? t.value : Number(t.value)||0;
      // update total display without full re-render (avoid losing focus)
      const totalEl = row.querySelector('div');
      if(totalEl) totalEl.textContent = fmt(qtRowTotal(qtForm[list][idx]));
      updateQtTotalsBox();
    }
    if(t.dataset && t.dataset.action==='rc-item-input'){
      const row = t.closest('.itemrow');
      const idx = Number(row.dataset.idx), field = t.dataset.field;
      rcForm.items[idx][field] = field==='desc' ? t.value : Number(t.value)||0;
      updateRcTotalsBox();
    }
    if(t.id==='rc-wht-rate'){
      rcForm.whtRate = Number(t.value)||0;
      updateRcTotalsBox();
    }
    if(t.id==='qt-wht-rate'){
      qtForm.whtRate = Number(t.value)||0;
      updateQtTotalsBox();
    }
    if(t.id==='qt-vat-rate'){
      qtForm.vatRate = Number(t.value)||0;
      updateQtTotalsBox();
    }
    if(t.id==='rc-vat-rate'){
      rcForm.vatRate = Number(t.value)||0;
      updateRcTotalsBox();
    }
    if(t.id==='tx-amount'){
      txForm.amount = Number(t.value)||0;
      updateTxTotalsBox();
    }
    if(t.id==='tx-wht-rate'){
      txForm.whtRate = Number(t.value)||0;
      updateTxTotalsBox();
    }
    if(t.id==='tx-vat-rate'){
      txForm.vatRate = Number(t.value)||0;
      updateTxTotalsBox();
    }
  };
}

function updateQtTotalsBox(){
  const box = document.querySelector('.totals-box');
  if(!box) return;
  box.innerHTML = qtTotalsBoxHtml(qtForm);
}
function updateRcTotalsBox(){
  const box = document.querySelector('.totals-box');
  if(!box) return;
  box.innerHTML = rcTotalsBoxHtml(rcForm);
}
function updateTxTotalsBox(){
  const box = document.querySelector('.totals-box');
  if(!box) return;
  box.innerHTML = txTotalsBoxHtml(txForm);
}

(async function init(){
  document.getElementById('app').innerHTML = `<div style="padding:40px; font-family:sans-serif; color:#6B7280;">กำลังโหลดข้อมูล…</div>`;
  try{
    state = await loadState();
  }catch(e){
    console.error('Storage load failed', e);
    document.getElementById('app').innerHTML = `<div style="padding:40px; font-family:sans-serif; color:#B42318;">
      โหลดข้อมูลไม่สำเร็จ (อาจหมดเวลาเข้าสู่ระบบหรืออินเทอร์เน็ตขัดข้อง)<br><br>
      <button class="btn btn-primary" onclick="location.reload()">โหลดใหม่ / เข้าสู่ระบบ</button></div>`;
    return;
  }
  seedIfEmpty();
  render();
})();
